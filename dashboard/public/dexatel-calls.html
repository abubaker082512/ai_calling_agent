<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dexatel Calls - AI Calling Agent</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dexatel-styles.css">
</head>

<body>
    <div id="navigation"></div>

    <div class="main-content">
        <div class="page-header">
            <h1>📞 Dexatel Calls</h1>
            <p>Manage and monitor your Dexatel voice calls</p>
        </div>

        <div class="content-wrapper">
            <!-- Stats -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="stat-label">Total Calls</div>
                    <div class="stat-value" id="totalCalls">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Active Calls</div>
                    <div class="stat-value" id="activeCalls">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Completed</div>
                    <div class="stat-value" id="completedCalls">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Cost</div>
                    <div class="stat-value" id="totalCost">$0.00</div>
                </div>
            </div>

            <!-- Calls List -->
            <div class="card">
                <div class="card-header">
                    <div>
                        <h2>Recent Calls</h2>
                        <p>Auto-refreshes every 10 seconds</p>
                    </div>
                    <button class="btn btn-primary" onclick="loadCalls()">🔄 Refresh</button>
                </div>
                <div class="table-container" id="callsContainer">
                    <div class="empty-state">
                        <div class="empty-state-icon">📞</div>
                        <div class="empty-state-title">Loading calls...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="nav-component.js"></script>
    <script>
        async function loadCalls() {
            try {
                const response = await fetch('/api/dexatel/calls');
                const data = await response.json();

                if (data.success && data.calls.length > 0) {
                    const tableHtml = `
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Call ID</th>
                                    <th>To Number</th>
                                    <th>Status</th>
                                    <th>Duration</th>
                                    <th>Cost</th>
                                    <th>Created</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.calls.map(call => `
                                    <tr>
                                        <td><code>${call.call_id.substring(0, 8)}...</code></td>
                                        <td>${call.to_number}</td>
                                        <td><span class="badge badge-${call.status === 'completed' ? 'success' : call.status === 'active' ? 'info' : 'error'}">${call.status}</span></td>
                                        <td>${call.duration || 0}s</td>
                                        <td>$${(call.cost || 0).toFixed(4)}</td>
                                        <td>${new Date(call.created_at).toLocaleString()}</td>
                                        <td>
                                            ${call.status === 'active' ?
                            `<button class="btn btn-danger" onclick="hangupCall('${call.call_id}')">Hangup</button>` :
                            '<span style="color: var(--text-tertiary);">-</span>'}
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                    document.getElementById('callsContainer').innerHTML = tableHtml;

                    // Update stats
                    const stats = data.calls.reduce((acc, call) => {
                        acc.total++;
                        if (call.status === 'active') acc.active++;
                        if (call.status === 'completed') acc.completed++;
                        acc.cost += call.cost || 0;
                        return acc;
                    }, { total: 0, active: 0, completed: 0, cost: 0 });

                    document.getElementById('totalCalls').textContent = stats.total;
                    document.getElementById('activeCalls').textContent = stats.active;
                    document.getElementById('completedCalls').textContent = stats.completed;
                    document.getElementById('totalCost').textContent = `$${stats.cost.toFixed(2)}`;
                } else {
                    document.getElementById('callsContainer').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📞</div>
                            <div class="empty-state-title">No calls yet</div>
                            <div class="empty-state-description">Make your first call to see it here</div>
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('callsContainer').innerHTML = `
                    <div class="alert alert-error">❌ Error loading calls: ${error.message}</div>
                `;
            }
        }

        async function hangupCall(callId) {
            if (!confirm('Are you sure you want to hangup this call?')) return;

            try {
                const response = await fetch(`/api/dexatel/calls/${callId}`, { method: 'DELETE' });
                const data = await response.json();

                if (data.success) {
                    alert('Call ended successfully');
                    loadCalls();
                } else {
                    alert(`Error: ${data.error}`);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        // Load calls on page load
        window.addEventListener('load', loadCalls);

        // Auto-refresh every 10 seconds
        setInterval(loadCalls, 10000);
    </script>
</body>

</html>
