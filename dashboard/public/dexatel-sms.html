<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send SMS - AI Calling Agent</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dexatel-styles.css">
</head>

<body>
    <div id="navigation"></div>

    <div class="main-content">
        <div class="page-header">
            <h1>📱 Send SMS</h1>
            <p>Send single SMS messages via Dexatel</p>
        </div>

        <div class="content-wrapper">
            <!-- SMS Form -->
            <div class="card">
                <div class="card-header">
                    <h2>Compose SMS</h2>
                </div>
                <div class="form-group">
                    <label class="form-label" for="phoneNumber">Phone Number (E.164 format)</label>
                    <input type="tel" class="form-input" id="phoneNumber" placeholder="+923185954599">
                    <div class="form-hint">Format: +[country code][number]</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="message">Message</label>
                    <textarea class="form-textarea" id="message" placeholder="Enter your message here..."></textarea>
                    <div class="form-hint">
                        <span id="charCount">0</span> / 160 characters
                        (<span id="smsCount">1</span> SMS)
                    </div>
                </div>

                <div class="alert alert-info" id="costEstimate" style="display: none;">
                    💰 <strong>Cost Estimate:</strong> $<span id="estimatedCost">0.00</span>
                </div>

                <button class="btn btn-success" id="sendBtn" onclick="sendSMS()">📤 Send SMS</button>

                <div id="result"></div>
            </div>

            <!-- Recent SMS -->
            <div class="card">
                <div class="card-header">
                    <div>
                        <h2>Recent SMS</h2>
                        <p>Auto-refreshes every 30 seconds</p>
                    </div>
                    <button class="btn btn-primary" onclick="loadRecentSMS()">🔄 Refresh</button>
                </div>
                <div id="smsList">
                    <div class="empty-state">
                        <div class="empty-state-icon">📱</div>
                        <div class="empty-state-title">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="nav-component.js"></script>
    <script>
        const messageInput = document.getElementById('message');
        const charCount = document.getElementById('charCount');
        const smsCount = document.getElementById('smsCount');
        const costEstimate = document.getElementById('costEstimate');
        const estimatedCost = document.getElementById('estimatedCost');

        messageInput.addEventListener('input', () => {
            const length = messageInput.value.length;
            charCount.textContent = length;

            const parts = Math.ceil(length / 160) || 1;
            smsCount.textContent = parts;

            if (length > 0) {
                const cost = parts * 0.01;
                estimatedCost.textContent = cost.toFixed(2);
                costEstimate.style.display = 'block';
            } else {
                costEstimate.style.display = 'none';
            }
        });

        async function sendSMS() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const message = messageInput.value;
            const resultDiv = document.getElementById('result');
            const sendBtn = document.getElementById('sendBtn');

            if (!phoneNumber || !message) {
                alert('Please fill in all fields');
                return;
            }

            if (!phoneNumber.match(/^\+[1-9]\d{1,14}$/)) {
                alert('Invalid phone number format. Use E.164 format (e.g., +1234567890)');
                return;
            }

            sendBtn.disabled = true;
            sendBtn.textContent = '📤 Sending...';
            resultDiv.innerHTML = '';

            try {
                const response = await fetch('/api/dexatel/sms/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to: phoneNumber, message: message })
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="alert alert-success">
                            ✅ SMS sent successfully!<br>
                            Message ID: ${data.result.message_id}<br>
                            Status: ${data.result.status}<br>
                            Cost: $${(data.result.cost || 0).toFixed(4)}
                        </div>
                    `;

                    document.getElementById('phoneNumber').value = '';
                    messageInput.value = '';
                    messageInput.dispatchEvent(new Event('input'));

                    loadRecentSMS();
                } else {
                    resultDiv.innerHTML = `
                        <div class="alert alert-error">
                            ❌ Error: ${data.error}<br>
                            ${data.message || ''}
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="alert alert-error">
                        ❌ Error: ${error.message}
                    </div>
                `;
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '📤 Send SMS';
            }
        }

        async function loadRecentSMS() {
            try {
                const response = await fetch('/api/dexatel/sms/list');
                const data = await response.json();

                const smsList = document.getElementById('smsList');

                if (data.success && data.messages.length > 0) {
                    smsList.innerHTML = data.messages.slice(0, 10).map(sms => `
                        <div style="padding: 16px 0; border-bottom: 1px solid var(--border);">
                            <div><strong>To:</strong> ${sms.to_number}</div>
                            <div><strong>Message:</strong> ${sms.message.substring(0, 100)}${sms.message.length > 100 ? '...' : ''}</div>
                            <div>
                                <strong>Status:</strong> 
                                <span class="badge badge-${sms.status === 'delivered' ? 'success' : sms.status === 'sent' ? 'info' : 'error'}">${sms.status}</span>
                            </div>
                            <div><strong>Cost:</strong> $${(sms.cost || 0).toFixed(4)}</div>
                            <div><strong>Sent:</strong> ${new Date(sms.created_at).toLocaleString()}</div>
                        </div>
                    `).join('');
                } else {
                    smsList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📱</div>
                            <div class="empty-state-title">No SMS sent yet</div>
                            <div class="empty-state-description">Send your first SMS to see it here</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading SMS:', error);
            }
        }

        window.addEventListener('load', loadRecentSMS);
        setInterval(loadRecentSMS, 30000);
    </script>
</body>

</html>
