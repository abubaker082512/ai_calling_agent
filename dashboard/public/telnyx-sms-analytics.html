<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Analytics - AI Calling Agent</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="dexatel-styles.css">
</head>

<body>
    <!-- Sidebar Navigation -->
    <div id="nav-placeholder"></div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="page-header">
            <h1>📊 SMS Analytics</h1>
            <p>Track your SMS performance and costs</p>
        </div>

        <div class="content-wrapper">
            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Total SMS</div>
                    <div class="stat-value" id="totalSms">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Delivered</div>
                    <div class="stat-value" id="deliveredSms">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Delivery Rate</div>
                    <div class="stat-value" id="deliveryRate">0%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Cost</div>
                    <div class="stat-value" id="totalCost">$0.00</div>
                </div>
            </div>

            <!-- Analytics Details -->
            <div class="card">
                <div class="card-header">
                    <div>
                        <h2>SMS Statistics</h2>
                        <p>Detailed breakdown of your SMS usage</p>
                    </div>
                    <button class="btn btn-primary" onclick="loadAnalytics()">🔄 Refresh</button>
                </div>

                <div id="analyticsDetails">
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <div class="empty-state-title">Loading...</div>
                    </div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="card">
                <div class="card-header">
                    <h2>Recent Activity</h2>
                </div>

                <div id="recentActivity">
                    <div class="empty-state">
                        <div class="empty-state-icon">📱</div>
                        <div class="empty-state-title">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="nav-component.js"></script>
    <script>
        async function loadAnalytics() {
            try {
                const response = await fetch('/api/telnyx/sms/analytics');
                const data = await response.json();

                if (data.success) {
                    const analytics = data.analytics;

                    // Update stats cards
                    document.getElementById('totalSms').textContent = analytics.total_sms || 0;
                    document.getElementById('deliveredSms').textContent = analytics.delivered_count || 0;
                    document.getElementById('deliveryRate').textContent = analytics.delivery_rate + '%';
                    document.getElementById('totalCost').textContent = '$' + analytics.total_cost;

                    // Update analytics details
                    const detailsDiv = document.getElementById('analyticsDetails');
                    detailsDiv.innerHTML = `
                        <div style="padding: 20px;">
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
                                <div>
                                    <div style="color: var(--text-secondary); font-size: 13px; margin-bottom: 4px;">Total Messages</div>
                                    <div style="font-size: 24px; font-weight: 600;">${analytics.total_sms}</div>
                                </div>
                                <div>
                                    <div style="color: var(--text-secondary); font-size: 13px; margin-bottom: 4px;">Sent</div>
                                    <div style="font-size: 24px; font-weight: 600; color: var(--info);">${analytics.sent_count}</div>
                                </div>
                                <div>
                                    <div style="color: var(--text-secondary); font-size: 13px; margin-bottom: 4px;">Delivered</div>
                                    <div style="font-size: 24px; font-weight: 600; color: var(--success);">${analytics.delivered_count}</div>
                                </div>
                                <div>
                                    <div style="color: var(--text-secondary); font-size: 13px; margin-bottom: 4px;">Failed</div>
                                    <div style="font-size: 24px; font-weight: 600; color: var(--error);">${analytics.failed_count}</div>
                                </div>
                                <div>
                                    <div style="color: var(--text-secondary); font-size: 13px; margin-bottom: 4px;">Avg Cost/SMS</div>
                                    <div style="font-size: 24px; font-weight: 600;">$${analytics.avg_cost}</div>
                                </div>
                                <div>
                                    <div style="color: var(--text-secondary); font-size: 13px; margin-bottom: 4px;">Delivery Rate</div>
                                    <div style="font-size: 24px; font-weight: 600;">${analytics.delivery_rate}%</div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    document.getElementById('analyticsDetails').innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📊</div>
                            <div class="empty-state-title">No data available</div>
                            <div class="empty-state-description">Send some SMS to see analytics</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading analytics:', error);
            }
        }

        async function loadRecentActivity() {
            try {
                const response = await fetch('/api/telnyx/sms/list?limit=10');
                const data = await response.json();

                const activityDiv = document.getElementById('recentActivity');

                if (data.success && data.messages.length > 0) {
                    activityDiv.innerHTML = data.messages.map(sms => `
                        <div style="padding: 16px 0; border-bottom: 1px solid var(--border);">
                            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px;">
                                <div>
                                    <strong>${sms.to_number}</strong><br>
                                    <span style="color: var(--text-secondary); font-size: 13px;">
                                        ${new Date(sms.created_at).toLocaleString()}
                                    </span>
                                </div>
                                <div style="text-align: right;">
                                    <span class="badge badge-${sms.status === 'delivered' ? 'success' : sms.status === 'sent' ? 'info' : 'error'}">
                                        ${sms.status}
                                    </span><br>
                                    <span style="color: var(--text-tertiary); font-size: 12px;">
                                        $${sms.cost?.toFixed(4) || '0.0000'}
                                    </span>
                                </div>
                            </div>
                            <div style="color: var(--text-secondary); font-size: 14px;">
                                ${sms.message.substring(0, 100)}${sms.message.length > 100 ? '...' : ''}
                            </div>
                        </div>
                    `).join('');
                } else {
                    activityDiv.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📱</div>
                            <div class="empty-state-title">No activity yet</div>
                            <div class="empty-state-description">Send SMS to see activity</div>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading recent activity:', error);
            }
        }

        window.addEventListener('load', () => {
            loadAnalytics();
            loadRecentActivity();

            // Auto-refresh every 30 seconds
            setInterval(() => {
                loadAnalytics();
                loadRecentActivity();
            }, 30000);
        });
    </script>
</body>

</html>
